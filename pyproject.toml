[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csvguard"
version = "0.1.0"
description = "Small, dependency-free CSV quality checks for data pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jabourala-maker"}]

[project.scripts]
csvguard = "csvguard:main"
